<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, sans-serif;
      font-size: 13px;
    }
    h2 { margin: 0 0 12px; font-size: 15px; }
    .status {
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .connected { background: #e8f5e9; color: #2e7d32; }
    .disconnected { background: #fce4ec; color: #b71c1c; }
    input {
      width: 100%;
      padding: 6px 8px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 12px;
    }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .btn-primary { background: #1976d2; color: white; }
    .btn-secondary { background: #f5f5f5; color: #333; }
    .info { font-size: 11px; color: #666; margin-top: 8px; }
    .error { color: #b71c1c; font-size: 11px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h2>Study Tracker</h2>

  <div id="status" class="status disconnected">
    연결 안 됨
  </div>

  <div id="login-form">
    <div id="error" class="error"></div>
    <button class="btn-primary" id="googleLoginBtn">Google 계정으로 로그인</button>
  </div>

  <div id="connected-info" style="display:none">
    <button class="btn-secondary" id="logoutBtn">로그아웃</button>
    <button class="btn-secondary" id="sendBtn">지금 전송</button>
  </div>

  <div class="info" id="info"></div>

  <script src="popup.js"></script>
</body>
</html>
